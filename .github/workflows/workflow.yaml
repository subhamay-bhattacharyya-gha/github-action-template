name: Reusable Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'dev'
        type: string
      debug:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean
    secrets:
      github_token:
        description: 'GitHub token for API access'
        required: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ env.NODE_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        if: ${{ hashFiles('**/build') == '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 1

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    steps:
      - name: Check build status
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "Build job failed"
          exit 1

      - name: Check test status
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "Test job failed"
          exit 1

      - name: Validation passed
        run: echo "All checks passed"
